<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TAANA — Handwoven Modern Fashion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');

:root{
  --ink:#1B1B23;
  --maroon:#7A2039;
  --maroon-light:#9C3350;
  --mustard:#D9A441;
  --ivory:#EDE8DC;
  --paper:#FAF7F2;
  --green:#2F4538;
  --line: rgba(27,27,35,0.14);
  --font-display:'Fraunces', serif;
  --font-body:'Manrope', sans-serif;
  --font-mono:'Space Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--mustard); color:var(--ink);}

/* ---------- layout helpers ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
@media(max-width:640px){.wrap{padding:0 18px;}}

.thread-rule{
  height:0; border-top:2px dashed var(--mustard); position:relative; margin:0;
}
.thread-rule.thin{border-top-width:1px; border-color:var(--line);}

/* ---------- header ---------- */
.announce{
  background:var(--ink); color:var(--ivory); font-family:var(--font-mono);
  font-size:11px; letter-spacing:.04em; text-align:center; padding:7px 10px;
}
header.site{
  position:sticky; top:0; z-index:40; background:var(--paper);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex; align-items:center; justify-content:space-between; padding:18px 0;}
.logo{
  font-family:var(--font-display); font-weight:700; font-size:26px; letter-spacing:.02em;
  cursor:pointer; background:none; border:none; color:var(--ink); padding:0; display:flex; align-items:baseline; gap:6px;
}
.logo .dot{color:var(--maroon); font-size:26px;}
nav.cats{display:flex; gap:22px; font-size:14px;}
nav.cats button{
  background:none; border:none; color:var(--ink); font-family:var(--font-body); font-weight:500;
  padding:4px 0; border-bottom:2px solid transparent; opacity:.75;
}
nav.cats button.active, nav.cats button:hover{opacity:1; border-bottom-color:var(--mustard);}
.header-actions{display:flex; align-items:center; gap:16px;}
.search-box{
  display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:20px;
  padding:7px 14px; background:var(--ivory);
}
.search-box input{border:none; background:none; outline:none; font-size:13px; width:130px; color:var(--ink);}
.icon-btn{
  background:none; border:none; position:relative; display:flex; align-items:center; color:var(--ink);
}
.cart-count{
  position:absolute; top:-8px; right:-10px; background:var(--maroon); color:var(--paper);
  font-family:var(--font-mono); font-size:10px; border-radius:50%; width:17px; height:17px;
  display:flex; align-items:center; justify-content:center;
}
.orders-link{font-size:13px; font-weight:600; background:none; border:none; color:var(--ink);}
@media(max-width:900px){ nav.cats{display:none;} .search-box{display:none;} }

/* ---------- hero ---------- */
.hero{padding:64px 0 40px; position:relative; overflow:hidden;}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center;}
@media(max-width:820px){.hero-grid{grid-template-columns:1fr;}}
.hero h1{
  font-family:var(--font-display); font-size:clamp(38px,5.4vw,64px); line-height:1.02; margin:0 0 18px;
  font-weight:600; letter-spacing:-.01em;
}
.hero h1 em{font-style:italic; color:var(--maroon);}
.hero p.lede{font-size:16px; line-height:1.6; color:#3d3d45; max-width:440px; margin:0 0 26px;}
.hero-cta{
  background:var(--ink); color:var(--paper); border:none; padding:14px 26px; font-size:14px;
  font-weight:600; letter-spacing:.02em; border-radius:2px;
}
.hero-cta:hover{background:var(--maroon);}
.loom{width:100%; height:auto; display:block;}
.loom-line{stroke-dasharray:6 8; animation:weave 6s linear infinite;}
@keyframes weave{to{stroke-dashoffset:-140;}}

/* ---------- category chips ---------- */
.chips{display:flex; gap:10px; flex-wrap:wrap; padding:30px 0 6px;}
.chip{
  border:1px solid var(--ink); background:var(--paper); padding:8px 16px; border-radius:2px;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px;
}
.chip .swab{width:12px; height:12px; display:inline-block; border-radius:2px;}
.chip.active{background:var(--ink); color:var(--paper);}

/* ---------- product grid ---------- */
.grid-section{padding:20px 0 70px;}
.section-head{display:flex; justify-content:space-between; align-items:baseline; margin:20px 0 22px;}
.section-head h2{font-family:var(--font-display); font-size:26px; font-weight:600; margin:0;}
.section-head span{font-family:var(--font-mono); font-size:12px; color:#6b6b73;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:26px;}
.card{
  background:var(--ivory); border:1px solid var(--line); border-radius:2px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-4px); box-shadow:0 14px 26px rgba(27,27,35,.10);}
.swatch{
  height:210px; position:relative; cursor:pointer;
}
.swatch::after{
  content:''; position:absolute; inset:0;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.14) 0px, rgba(255,255,255,.14) 2px, transparent 2px, transparent 10px);
}
.swatch .tag-new{
  position:absolute; top:10px; left:10px; background:var(--paper); color:var(--ink); font-family:var(--font-mono);
  font-size:10px; padding:3px 8px; border:1px solid var(--ink); letter-spacing:.04em;
}
.card-body{padding:14px 14px 16px; display:flex; flex-direction:column; gap:8px; flex:1;}
.card-cat{font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--maroon);}
.card-name{font-family:var(--font-display); font-size:17px; font-weight:600; margin:0;}
.card-foot{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:6px;}
.price-tag{
  position:relative; display:inline-flex; align-items:center; gap:6px; background:var(--paper);
  border:1px solid var(--ink); padding:4px 10px 4px 17px; font-family:var(--font-mono); font-size:11px;
  clip-path:polygon(11px 0, 100% 0, 100% 100%, 11px 100%, 0 50%);
}
.price-tag::before{content:''; position:absolute; left:5px; top:50%; transform:translateY(-50%); width:4px; height:4px; border-radius:50%; background:var(--ink);}
.price-now{font-weight:700;}
.price-mrp{text-decoration:line-through; color:#8a8a90;}
.price-off{color:var(--green); font-weight:700;}
.view-btn{
  background:none; border:1px solid var(--ink); padding:7px 12px; font-size:12px; font-weight:600; border-radius:2px;
}
.view-btn:hover{background:var(--ink); color:var(--paper);}
.empty-state{padding:60px 0; text-align:center; color:#6b6b73; font-family:var(--font-body);}

/* ---------- overlays (modal / drawer) ---------- */
.overlay-bg{
  position:fixed; inset:0; background:rgba(27,27,35,.45); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s ease;
}
.overlay-bg.show{opacity:1; pointer-events:auto;}

.drawer{
  position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:var(--paper);
  z-index:70; transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column;
  box-shadow:-8px 0 30px rgba(0,0,0,.15);
}
.drawer.show{transform:translateX(0);}
.drawer-head{display:flex; justify-content:space-between; align-items:center; padding:20px 22px; border-bottom:1px solid var(--line);}
.drawer-head h3{font-family:var(--font-display); font-size:20px; margin:0;}
.drawer-body{flex:1; overflow-y:auto; padding:16px 22px;}
.drawer-foot{padding:18px 22px; border-top:1px solid var(--line);}
.close-x{background:none; border:none; font-size:18px; color:var(--ink);}

.cart-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--line);}
.cart-item .mini-swatch{width:60px; height:74px; border-radius:2px; flex-shrink:0; position:relative;}
.ci-info{flex:1; display:flex; flex-direction:column; gap:4px;}
.ci-name{font-family:var(--font-display); font-size:15px; font-weight:600;}
.ci-meta{font-family:var(--font-mono); font-size:11px; color:#6b6b73;}
.ci-row{display:flex; align-items:center; justify-content:space-between; margin-top:4px;}
.qty-stepper{display:flex; align-items:center; border:1px solid var(--ink); border-radius:2px;}
.qty-stepper button{background:none; border:none; width:26px; height:26px; font-size:14px;}
.qty-stepper span{width:24px; text-align:center; font-family:var(--font-mono); font-size:12px;}
.remove-btn{background:none; border:none; font-family:var(--font-mono); font-size:11px; text-decoration:underline; color:var(--maroon);}
.subtotal-row{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:14px; margin-bottom:14px;}
.primary-btn{
  width:100%; background:var(--ink); color:var(--paper); border:none; padding:14px; font-size:14px; font-weight:700;
  letter-spacing:.02em; border-radius:2px;
}
.primary-btn:hover{background:var(--maroon);}
.secondary-btn{
  width:100%; background:none; color:var(--ink); border:1px solid var(--ink); padding:12px; font-size:13px; font-weight:600;
  border-radius:2px; margin-top:8px;
}

/* product modal */
.modal{
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.96); width:820px; max-width:92vw;
  max-height:88vh; overflow:auto; background:var(--paper); z-index:70; opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease; border-radius:2px;
}
.modal.show{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1);}
.modal-grid{display:grid; grid-template-columns:1fr 1fr;}
@media(max-width:700px){.modal-grid{grid-template-columns:1fr;}}
.modal-swatch{height:100%; min-height:280px; position:relative;}
.modal-info{padding:30px 28px; display:flex; flex-direction:column; gap:14px; position:relative;}
.modal-info .close-x{position:absolute; top:14px; right:14px;}
.modal-info h2{font-family:var(--font-display); font-size:28px; margin:0; font-weight:600;}
.modal-desc{font-size:14px; line-height:1.6; color:#3d3d45;}
.size-row{display:flex; gap:8px; flex-wrap:wrap;}
.size-btn{border:1px solid var(--ink); background:none; padding:8px 14px; font-size:12px; font-family:var(--font-mono); border-radius:2px;}
.size-btn.active{background:var(--ink); color:var(--paper);}
.field-label{font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#6b6b73;}

/* ---------- checkout ---------- */
.checkout-wrap{padding:50px 0 90px; max-width:640px; margin:0 auto;}
.steps{display:flex; gap:0; margin-bottom:36px; font-family:var(--font-mono); font-size:12px;}
.step{flex:1; text-align:center; padding-bottom:10px; border-bottom:3px solid var(--line); color:#9a9aa0;}
.step.active{border-color:var(--maroon); color:var(--ink); font-weight:700;}
.step.done{border-color:var(--mustard); color:var(--ink);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:2px;}
.field input{
  border:1px solid var(--line); background:var(--ivory); padding:11px 12px; font-size:14px; border-radius:2px; outline:none;
}
.field input:focus{border-color:var(--ink);}
.pay-option{
  display:flex; align-items:center; gap:12px; border:1px solid var(--line); padding:16px; border-radius:2px; margin-bottom:12px; cursor:pointer;
}
.pay-option.active{border-color:var(--ink); background:var(--ivory);}
.pay-option input{accent-color:var(--maroon);}
.review-card{border:1px solid var(--line); border-radius:2px; padding:18px; margin-bottom:16px;}
.review-card h4{font-family:var(--font-display); font-size:15px; margin:0 0 10px;}
.review-line{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed var(--line);}
.review-line:last-child{border-bottom:none;}
.total-line{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:16px; font-weight:700; padding-top:10px;}
.btn-row{display:flex; gap:10px; margin-top:20px;}
.ghost-btn{background:none; border:1px solid var(--line); padding:13px 18px; font-size:13px; border-radius:2px; color:#6b6b73;}

/* ---------- confirmation ---------- */
.confirm-wrap{padding:90px 0; text-align:center; max-width:480px; margin:0 auto;}
.stitch-circle{
  width:78px; height:78px; border-radius:50%; border:2px dashed var(--mustard); display:flex; align-items:center;
  justify-content:center; margin:0 auto 24px; font-family:var(--font-display); font-size:36px; color:var(--maroon);
}
.confirm-wrap h2{font-family:var(--font-display); font-size:28px; margin:0 0 8px;}
.confirm-id{font-family:var(--font-mono); font-size:13px; color:#6b6b73; margin-bottom:26px;}

/* ---------- orders ---------- */
.orders-wrap{padding:50px 0 90px;}
.order-card{border:1px solid var(--line); border-radius:2px; padding:18px 20px; margin-bottom:16px; background:var(--ivory);}
.order-top{display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
.order-id{font-family:var(--font-mono); font-size:12px; color:#6b6b73;}
.status-tag{
  font-family:var(--font-mono); font-size:10px; background:var(--green); color:var(--paper); padding:4px 10px; border-radius:20px;
  letter-spacing:.04em;
}
.order-items-btn{background:none; border:none; text-decoration:underline; font-size:12px; color:var(--maroon); margin-top:8px;}
.order-items-list{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); display:none;}
.order-items-list.show{display:block;}
.order-item-row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0;}

/* ---------- toast ---------- */
.toast{
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper);
  padding:13px 22px; border-radius:2px; font-size:13px; z-index:90; opacity:0; pointer-events:none; transition:all .22s ease;
  font-family:var(--font-mono);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line); padding:36px 0; margin-top:20px;}
.footer-inner{display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; font-size:12px; color:#6b6b73;}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ---------------- data ---------------- */
const PRODUCTS = [
  {id:'e1', name:'Ikat Weave Kurta', category:'Ethnic Wear', price:1899, mrp:2499, swatch:['#7A2039','#D9A441'], desc:'Hand-loomed cotton kurta with traditional ikat detailing running along the yoke. Cut for an easy, relaxed fit.', isNew:true},
  {id:'e2', name:'Block Print Anarkali', category:'Ethnic Wear', price:2799, mrp:3499, swatch:['#2F4538','#EDE8DC'], desc:'A flowing anarkali silhouette finished with hand block-printed florals, made in small batches by our partner artisans.'},
  {id:'e3', name:'Zari Border Saree', category:'Ethnic Wear', price:4299, mrp:5999, swatch:['#1B1B23','#D9A441'], desc:'Pure cotton saree with a hand-woven zari border — six yards of quiet, everyday luxury.'},
  {id:'w1', name:'Structured Blazer', category:'Western Wear', price:3299, mrp:3999, swatch:['#1B1B23','#7A2039'], desc:'A tailored blazer with a nipped waist, cut from a heavyweight twill that holds its shape all day.', isNew:true},
  {id:'w2', name:'Linen Wrap Dress', category:'Western Wear', price:2199, mrp:2799, swatch:['#EDE8DC','#2F4538'], desc:'Breathable linen dress with a self-tie waist, built for long, warm afternoons.'},
  {id:'w3', name:'Denim Culottes', category:'Western Wear', price:1699, mrp:2199, swatch:['#2B3A5C','#D9A441'], desc:'Wide-leg denim culottes with a high rise and a raw, unfinished hem.'},
  {id:'f1', name:'Woven Kolhapuri', category:'Footwear', price:1299, mrp:1699, swatch:['#7A2039','#1B1B23'], desc:'Handcrafted leather Kolhapuris with a braided, woven upper and a hand-stitched sole.'},
  {id:'f2', name:'Canvas Slip-On', category:'Footwear', price:1099, mrp:1499, swatch:['#EDE8DC','#1B1B23'], desc:'Everyday canvas slip-ons with a cushioned cork footbed for all-day wear.'},
  {id:'f3', name:'Block Heel Mule', category:'Footwear', price:1899, mrp:2499, swatch:['#D9A441','#7A2039'], desc:'Suede block-heel mules finished with a hand-stitched vamp, comfortable enough for long days out.', isNew:true},
  {id:'a1', name:'Madras Check Stole', category:'Accessories', price:899, mrp:1199, swatch:['#7A2039','#D9A441','#2F4538'], desc:'A lightweight cotton stole woven in a classic madras check — one for every season.'},
  {id:'a2', name:'Brass Thread Earrings', category:'Accessories', price:599, mrp:799, swatch:['#D9A441','#1B1B23'], desc:'Hand-wound brass wire earrings finished with a matte thread tassel.'},
  {id:'a3', name:'Canvas Tote', category:'Accessories', price:799, mrp:999, swatch:['#EDE8DC','#7A2039'], desc:'A sturdy canvas tote with leather handles and an inside zip pocket, made to be used daily.'}
];
const CATEGORIES = ['All','Ethnic Wear','Western Wear','Footwear','Accessories'];

/* ---------------- state ---------------- */
let state = {
  view:'home', category:'All', search:'', cart:[], orders:[],
  cartOpen:false, productModal:null, modalSize:null, modalQty:1,
  checkoutStep:1, address:{name:'',phone:'',pincode:'',line1:'',city:'',state:''},
  payment:'cod', toast:null, loaded:false, openOrderId:null
};

const getProduct = id => PRODUCTS.find(p=>p.id===id);
const sizesFor = p => p.category==='Footwear' ? ['6','7','8','9','10'] : p.category==='Accessories' ? ['Free Size'] : ['S','M','L','XL'];
const swatchBg = colors => colors.length===1 ? colors[0] : `linear-gradient(135deg, ${colors.join(', ')})`;
const cartCount = () => state.cart.reduce((n,i)=>n+i.qty,0);
const cartTotal = () => state.cart.reduce((s,i)=> s + getProduct(i.id).price*i.qty, 0);

function priceTag(price, mrp){
  const off = mrp && mrp>price ? Math.round((1-price/mrp)*100) : 0;
  return `<span class="price-tag"><span class="price-now">₹${price}</span>${off>0?`<span class="price-mrp">₹${mrp}</span><span class="price-off">${off}% off</span>`:''}</span>`;
}

/* ---------------- persistence ---------------- */
async function saveCart(){ try{ await window.storage.set('cart', JSON.stringify(state.cart)); }catch(e){ console.error('save cart failed', e); } }
async function saveOrders(){ try{ await window.storage.set('orders', JSON.stringify(state.orders)); }catch(e){ console.error('save orders failed', e); } }
async function saveAddress(){ try{ await window.storage.set('address', JSON.stringify(state.address)); }catch(e){ console.error('save address failed', e); } }

async function init(){
  try{ const c = await window.storage.get('cart'); state.cart = c ? JSON.parse(c.value) : []; }catch(e){ state.cart=[]; }
  try{ const o = await window.storage.get('orders'); state.orders = o ? JSON.parse(o.value) : []; }catch(e){ state.orders=[]; }
  try{ const a = await window.storage.get('address'); if(a) state.address = JSON.parse(a.value); }catch(e){}
  state.loaded = true;
  renderApp();
}

/* ---------------- actions ---------------- */
function goHome(){ state.view='home'; state.cartOpen=false; renderApp(); window.scrollTo(0,0); }
function goOrders(){ state.view='orders'; state.cartOpen=false; renderApp(); window.scrollTo(0,0); }
function setCategory(cat){ state.view='home'; state.category=cat; renderApp(); }
function setSearch(val){ state.search = val; renderApp(); }
function toggleCart(){ state.cartOpen = !state.cartOpen; renderApp(); }

function openProduct(id){ state.productModal=id; state.modalSize=null; state.modalQty=1; renderApp(); }
function closeProduct(){ state.productModal=null; renderApp(); }
function pickSize(sz){ state.modalSize = sz; renderApp(); }
function incQty(){ state.modalQty = Math.min(5, state.modalQty+1); renderApp(); }
function decQty(){ state.modalQty = Math.max(1, state.modalQty-1); renderApp(); }

function showToast(msg){
  state.toast = {msg};
  renderApp();
  setTimeout(()=>{ if(state.toast && state.toast.msg===msg){ state.toast=null; renderApp(); } }, 2200);
}

function addToCart(){
  if(!state.modalSize){ showToast('Please pick a size first'); return; }
  const existing = state.cart.find(i=>i.id===state.productModal && i.size===state.modalSize);
  if(existing){ existing.qty += state.modalQty; } else { state.cart.push({id:state.productModal, size:state.modalSize, qty:state.modalQty}); }
  saveCart();
  state.productModal=null;
  state.cartOpen=true;
  renderApp();
  showToast('Added to your bag');
}

function changeCartQty(idx, delta){
  const item = state.cart[idx];
  item.qty = Math.max(1, item.qty+delta);
  saveCart(); renderApp();
}
function removeCartItem(idx){ state.cart.splice(idx,1); saveCart(); renderApp(); }

function goCheckout(){
  if(state.cart.length===0){ showToast('Your bag is empty'); return; }
  state.cartOpen=false; state.view='checkout'; state.checkoutStep=1; renderApp(); window.scrollTo(0,0);
}

function saveAddressAndNext(){
  const ids = ['addr-name','addr-phone','addr-pincode','addr-line1','addr-city','addr-state'];
  const vals = ids.map(id=>document.getElementById(id).value.trim());
  if(vals.some(v=>!v)){ showToast('Please fill in every field'); return; }
  const [name,phone,pincode,line1,city,st] = vals;
  state.address = {name,phone,pincode,line1,city,state:st};
  saveAddress();
  state.checkoutStep = 2;
  renderApp(); window.scrollTo(0,0);
}
function setPayment(val){ state.payment=val; renderApp(); }
function goStep(n){ state.checkoutStep=n; renderApp(); window.scrollTo(0,0); }

function placeOrder(){
  const order = {
    id: 'TN' + Date.now().toString().slice(-8),
    date: new Date().toISOString(),
    items: state.cart.map(i=>{ const p=getProduct(i.id); return {name:p.name, size:i.size, qty:i.qty, price:p.price}; }),
    address: {...state.address},
    payment: state.payment,
    total: cartTotal()
  };
  state.orders.unshift(order);
  saveOrders();
  state.cart = [];
  saveCart();
  state.view = 'confirmation';
  state.lastOrderId = order.id;
  renderApp(); window.scrollTo(0,0);
}
function toggleOrderItems(id){ state.openOrderId = state.openOrderId===id ? null : id; renderApp(); }

/* ---------------- render ---------------- */
function renderApp(){
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;

  document.getElementById('app').innerHTML = appHTML();

  if(activeId){
    const el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function appHTML(){
  if(!state.loaded){
    return `<div style="padding:120px 0; text-align:center; font-family:var(--font-mono); color:#6b6b73;">loading taana…</div>`;
  }
  return `
    <div class="announce">Free shipping over ₹1999 · Handwoven across India · Cash on Delivery available</div>
    ${headerHTML()}
    <main>${viewHTML()}</main>
    ${footerHTML()}
    ${cartDrawerHTML()}
    ${productModalHTML()}
    ${toastHTML()}
  `;
}

function headerHTML(){
  return `
  <header class="site">
    <div class="wrap header-inner">
      <button class="logo" onclick="goHome()">TAANA<span class="dot">.</span></button>
      <nav class="cats">
        ${CATEGORIES.map(c=>`<button class="${state.view==='home'&&state.category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}
      </nav>
      <div class="header-actions">
        <div class="search-box">
          <span style="font-size:13px;">⌕</span>
          <input id="search-input" placeholder="Search" value="${state.search}" oninput="setSearch(this.value)">
        </div>
        <button class="orders-link" onclick="goOrders()">My Orders</button>
        <button class="icon-btn" onclick="toggleCart()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6h15l-1.5 9h-13z"/><path d="M6 6L4.5 2H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          ${cartCount()>0?`<span class="cart-count">${cartCount()}</span>`:''}
        </button>
      </div>
    </div>
  </header>`;
}

function viewHTML(){
  if(state.view==='checkout') return checkoutHTML();
  if(state.view==='confirmation') return confirmationHTML();
  if(state.view==='orders') return ordersHTML();
  return homeHTML();
}

function heroSVG(){
  return `<svg class="loom" viewBox="0 0 480 340" xmlns="http://www.w3.org/2000/svg">
    <rect width="480" height="340" fill="var(--ivory)"/>
    ${[...Array(9)].map((_,i)=>`<line class="loom-line" x1="0" y1="${30+i*34}" x2="480" y2="${30+i*34}" stroke="${i%2===0?'#7A2039':'#D9A441'}" stroke-width="2" opacity="0.55"/>`).join('')}
    ${[...Array(12)].map((_,i)=>`<line x1="${20+i*38}" y1="0" x2="${20+i*38}" y2="340" stroke="#1B1B23" stroke-width="1" opacity="0.08"/>`).join('')}
  </svg>`;
}

function homeHTML(){
  let list = PRODUCTS.filter(p => state.category==='All' || p.category===state.category);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(p => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
  }
  return `
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1>Clothes woven<br>with <em>intention</em>.</h1>
        <p class="lede">TAANA (ताना) means the warp thread — the one that holds everything else together. Every piece here is built the same way: slow-made, hand-finished, meant to last longer than a season.</p>
        <button class="hero-cta" onclick="document.getElementById('grid-section').scrollIntoView({behavior:'smooth'})">Shop the collection</button>
      </div>
      <div>${heroSVG()}</div>
    </div>
  </section>

  <div class="wrap"><div class="thread-rule"></div></div>

  <div class="wrap">
    <div class="chips">
      ${CATEGORIES.map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="setCategory('${c}')">${c!=='All'?`<span class="swab" style="background:${chipColor(c)}"></span>`:''}${c}</button>`).join('')}
    </div>
  </div>

  <section class="grid-section" id="grid-section">
    <div class="wrap">
      <div class="section-head">
        <h2>${state.category==='All' ? 'The full collection' : state.category}</h2>
        <span>${list.length} piece${list.length!==1?'s':''}</span>
      </div>
      ${list.length===0 ? `<div class="empty-state">No pieces match “${state.search}”. Try a different search.</div>` : `
      <div class="grid">
        ${list.map(p=>`
          <div class="card">
            <div class="swatch" style="background:${swatchBg(p.swatch)}" onclick="openProduct('${p.id}')">
              ${p.isNew?'<span class="tag-new">NEW</span>':''}
            </div>
            <div class="card-body">
              <span class="card-cat">${p.category}</span>
              <h3 class="card-name">${p.name}</h3>
              <div class="card-foot">
                ${priceTag(p.price,p.mrp)}
                <button class="view-btn" onclick="openProduct('${p.id}')">View</button>
              </div>
            </div>
          </div>
        `).join('')}
      </div>`}
    </div>
  </section>
  `;
}

function chipColor(cat){
  const map = {'Ethnic Wear':'#7A2039','Western Wear':'#1B1B23','Footwear':'#D9A441','Accessories':'#2F4538'};
  return map[cat] || '#1B1B23';
}

function productModalHTML(){
  const p = state.productModal ? getProduct(state.productModal) : null;
  return `
  <div class="overlay-bg ${p?'show':''}" onclick="closeProduct()"></div>
  <div class="modal ${p?'show':''}">
    ${p ? `
    <div class="modal-grid">
      <div class="modal-swatch" style="background:${swatchBg(p.swatch)}"></div>
      <div class="modal-info">
        <button class="close-x" onclick="closeProduct()">✕</button>
        <span class="card-cat">${p.category}</span>
        <h2>${p.name}</h2>
        <div>${priceTag(p.price,p.mrp)}</div>
        <p class="modal-desc">${p.desc}</p>
        <div>
          <div class="field-label" style="margin-bottom:8px;">Size</div>
          <div class="size-row">
            ${sizesFor(p).map(sz=>`<button class="size-btn ${state.modalSize===sz?'active':''}" onclick="pickSize('${sz}')">${sz}</button>`).join('')}
          </div>
        </div>
        <div>
          <div class="field-label" style="margin-bottom:8px;">Quantity</div>
          <div class="qty-stepper" style="width:fit-content;">
            <button onclick="decQty()">−</button><span>${state.modalQty}</span><button onclick="incQty()">+</button>
          </div>
        </div>
        <button class="primary-btn" onclick="addToCart()">Add to Bag</button>
      </div>
    </div>` : ''}
  </div>`;
}

function cartDrawerHTML(){
  return `
  <div class="overlay-bg ${state.cartOpen?'show':''}" onclick="toggleCart()"></div>
  <div class="drawer ${state.cartOpen?'show':''}">
    <div class="drawer-head">
      <h3>Your Bag (${cartCount()})</h3>
      <button class="close-x" onclick="toggleCart()">✕</button>
    </div>
    <div class="drawer-body">
      ${state.cart.length===0 ? `<div class="empty-state">Your bag is empty.<br>Time to start weaving your wardrobe.</div>` :
      state.cart.map((item,idx)=>{
        const p = getProduct(item.id);
        return `
        <div class="cart-item">
          <div class="mini-swatch" style="background:${swatchBg(p.swatch)}"></div>
          <div class="ci-info">
            <span class="ci-name">${p.name}</span>
            <span class="ci-meta">Size ${item.size}</span>
            <div class="ci-row">
              <div class="qty-stepper">
                <button onclick="changeCartQty(${idx},-1)">−</button><span>${item.qty}</span><button onclick="changeCartQty(${idx},1)">+</button>
              </div>
              ${priceTag(p.price*item.qty)}
            </div>
            <button class="remove-btn" onclick="removeCartItem(${idx})">Remove</button>
          </div>
        </div>`;
      }).join('')}
    </div>
    ${state.cart.length>0 ? `
    <div class="drawer-foot">
      <div class="subtotal-row"><span>Subtotal</span><span>₹${cartTotal()}</span></div>
      <button class="primary-btn" onclick="goCheckout()">Proceed to Checkout</button>
      <button class="secondary-btn" onclick="toggleCart()">Continue Shopping</button>
    </div>` : ''}
  </div>`;
}

function checkoutHTML(){
  const s = state.checkoutStep;
  return `
  <div class="wrap checkout-wrap">
    <div class="steps">
      <div class="step ${s===1?'active':s>1?'done':''}">1 · Address</div>
      <div class="step ${s===2?'active':s>2?'done':''}">2 · Payment</div>
      <div class="step ${s===3?'active':''}">3 · Review</div>
    </div>

    ${s===1 ? `
    <div class="form-grid">
      <div class="field"><label class="field-label">Full name</label><input id="addr-name" value="${state.address.name}"></div>
      <div class="field"><label class="field-label">Phone number</label><input id="addr-phone" value="${state.address.phone}"></div>
      <div class="field full"><label class="field-label">Address line</label><input id="addr-line1" value="${state.address.line1}"></div>
      <div class="field"><label class="field-label">City</label><input id="addr-city" value="${state.address.city}"></div>
      <div class="field"><label class="field-label">State</label><input id="addr-state" value="${state.address.state}"></div>
      <div class="field"><label class="field-label">Pincode</label><input id="addr-pincode" value="${state.address.pincode}"></div>
    </div>
    <div class="btn-row">
      <button class="ghost-btn" onclick="goHome()">Cancel</button>
      <button class="primary-btn" onclick="saveAddressAndNext()">Continue to Payment</button>
    </div>` : ''}

    ${s===2 ? `
    <div class="pay-option ${state.payment==='cod'?'active':''}" onclick="setPayment('cod')">
      <input type="radio" name="pay" ${state.payment==='cod'?'checked':''}>
      <div><strong>Cash on Delivery</strong><div style="font-size:12px; color:#6b6b73; margin-top:2px;">Pay when your order arrives</div></div>
    </div>
    <div class="pay-option ${state.payment==='upi'?'active':''}" onclick="setPayment('upi')">
      <input type="radio" name="pay" ${state.payment==='upi'?'checked':''}>
      <div><strong>UPI / Card</strong><div style="font-size:12px; color:#6b6b73; margin-top:2px;">Demo mode — no real payment is processed</div></div>
    </div>
    <div class="btn-row">
      <button class="ghost-btn" onclick="goStep(1)">Back</button>
      <button class="primary-btn" onclick="goStep(3)">Review Order</button>
    </div>` : ''}

    ${s===3 ? `
    <div class="review-card">
      <h4>Delivery Address</h4>
      <div class="review-line"><span>${state.address.name}</span><span>${state.address.phone}</span></div>
      <div class="review-line"><span>${state.address.line1}, ${state.address.city}</span><span>${state.address.state} - ${state.address.pincode}</span></div>
    </div>
    <div class="review-card">
      <h4>Payment Method</h4>
      <div class="review-line"><span>${state.payment==='cod'?'Cash on Delivery':'UPI / Card (Demo)'}</span><span></span></div>
    </div>
    <div class="review-card">
      <h4>Order Summary</h4>
      ${state.cart.map(item=>{ const p=getProduct(item.id); return `<div class="review-line"><span>${p.name} (${item.size}) × ${item.qty}</span><span>₹${p.price*item.qty}</span></div>`; }).join('')}
      <div class="total-line"><span>Total</span><span>₹${cartTotal()}</span></div>
    </div>
    <div class="btn-row">
      <button class="ghost-btn" onclick="goStep(2)">Back</button>
      <button class="primary-btn" onclick="placeOrder()">Place Order</button>
    </div>` : ''}
  </div>`;
}

function confirmationHTML(){
  return `
  <div class="wrap confirm-wrap">
    <div class="stitch-circle">✓</div>
    <h2>Order placed</h2>
    <div class="confirm-id">Order ID · ${state.lastOrderId || ''}</div>
    <p style="font-size:14px; color:#3d3d45; line-height:1.6;">Thank you — your order is confirmed and will be handwoven into your wardrobe soon. You can track it anytime under My Orders.</p>
    <div class="btn-row" style="justify-content:center;">
      <button class="secondary-btn" style="width:auto; padding:13px 22px;" onclick="goHome()">Continue Shopping</button>
      <button class="primary-btn" style="width:auto; padding:13px 22px;" onclick="goOrders()">View My Orders</button>
    </div>
  </div>`;
}

function ordersHTML(){
  return `
  <div class="wrap orders-wrap">
    <div class="section-head"><h2>My Orders</h2><span>${state.orders.length} order${state.orders.length!==1?'s':''}</span></div>
    ${state.orders.length===0 ? `<div class="empty-state">No orders yet — start weaving your wardrobe.<br><br><button class="primary-btn" style="width:auto; padding:12px 20px;" onclick="goHome()">Browse the collection</button></div>` :
    state.orders.map(o=>`
      <div class="order-card">
        <div class="order-top">
          <div>
            <div class="order-id">${o.id} · ${new Date(o.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</div>
            <div style="font-size:14px; font-weight:700; margin-top:4px;">₹${o.total} · ${o.items.reduce((n,i)=>n+i.qty,0)} item${o.items.reduce((n,i)=>n+i.qty,0)!==1?'s':''}</div>
          </div>
          <span class="status-tag">Placed</span>
        </div>
        <button class="order-items-btn" onclick="toggleOrderItems('${o.id}')">${state.openOrderId===o.id?'Hide details':'View details'}</button>
        <div class="order-items-list ${state.openOrderId===o.id?'show':''}">
          ${o.items.map(i=>`<div class="order-item-row"><span>${i.name} (${i.size}) × ${i.qty}</span><span>₹${i.price*i.qty}</span></div>`).join('')}
          <div class="order-item-row" style="margin-top:6px; padding-top:6px; border-top:1px solid var(--line); font-size:12px; color:#6b6b73;"><span>Delivering to</span><span>${o.address.city}, ${o.address.pincode}</span></div>
          <div class="order-item-row" style="font-size:12px; color:#6b6b73;"><span>Payment</span><span>${o.payment==='cod'?'Cash on Delivery':'UPI / Card'}</span></div>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function toastHTML(){
  return `<div class="toast ${state.toast?'show':''}">${state.toast?state.toast.msg:''}</div>`;
}

function footerHTML(){
  return `
  <footer>
    <div class="wrap footer-inner">
      <span>© 2026 TAANA — Handwoven Modern Fashion</span>
      <span>Made in India · Ships nationwide</span>
    </div>
  </footer>`;
}

init();
</script>
</body>
</html>
